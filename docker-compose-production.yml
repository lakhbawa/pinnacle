version: "3.8"

services:
  # KAFKA INFRASTRUCTURE
  # Single-node Kafka in KRaft mode (no ZooKeeper container needed)
  pinnacle-kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # any base64 UUID; fixed so restarts reuse the same data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@pinnacle-kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://pinnacle-kafka:9092,PLAINTEXT_INTERNAL://pinnacle-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - kafka-kraft-data:/var/lib/kafka/data
    restart: always
    networks: [pinnacle-network]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Debug tool, off by default: docker compose -f docker-compose-production.yml --profile tools up -d
  pinnacle-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [tools]
    environment:
      KAFKA_CLUSTERS_0_NAME: pinnacle
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: pinnacle-kafka:29092
    depends_on:
      pinnacle-kafka:
        condition: service_healthy
    restart: always
    networks:
      - pinnacle-network
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kafka-ui-pinnacle.rule=Host(`kafka.pinnacle.lakhveerbawa.com`)"
      - "traefik.http.routers.kafka-ui-pinnacle.entrypoints=websecure"
      - "traefik.http.routers.kafka-ui-pinnacle.tls=true"
      - "traefik.http.routers.kafka-ui-pinnacle.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kafka-ui-pinnacle.service=kafka-ui-pinnacle"
      - "traefik.http.services.kafka-ui-pinnacle.loadbalancer.server.port=8080"

  # FRONTEND
  pinnacle-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
      - NEXT_PUBLIC_API_URL=https://api.pinnacle.lakhveerbawa.com/api/v1
    environment:
      - NEXT_PUBLIC_API_URL=https://api.pinnacle.lakhveerbawa.com/api/v1
      - NEXTAUTH_SECRET="your-secret-here-at-least-32-chars"
      - GITHUB_ID="Ov23lizCGkFF2NrJGP7O"
      - GITHUB_SECRET="TOKENHERE"
    restart: always
    depends_on:
      - pinnacle-gateway
    networks:
      - pinnacle-network
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pinnacle-lakhveerbawa-com.rule=Host(`pinnacle.lakhveerbawa.com`)"
      - "traefik.http.routers.pinnacle-lakhveerbawa-com.entrypoints=websecure"
      - "traefik.http.routers.pinnacle-lakhveerbawa-com.tls=true"
      - "traefik.http.routers.pinnacle-lakhveerbawa-com.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pinnacle-lakhveerbawa-com.service=pinnacle-lakhveerbawa-com"
      - "traefik.http.services.pinnacle-lakhveerbawa-com.loadbalancer.server.port=3000"

  # GATEWAY (Go)
  pinnacle-gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile.prod
    env_file: .env
    environment:
      - REDIS_HOST=pinnacle-redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=pinnacle-auth-service:4460
      - USERS_SERVICE_URL=pinnacle-users-service:4450
      - OUTCOMES_SERVICE_URL=pinnacle-outcomes-service:4440
    depends_on:
      - pinnacle-redis
      - pinnacle-services
    restart: always
    networks:
      - pinnacle-network
      - observer
      - web
    labels:
      - "traefik.enable=true"
      # Main router (non-www)
      - "traefik.http.routers.api-pinnacle-lakhveerbawa-com.rule=Host(`api.pinnacle.lakhveerbawa.com`)"
      - "traefik.http.routers.api-pinnacle-lakhveerbawa-com.entrypoints=websecure"
      - "traefik.http.routers.api-pinnacle-lakhveerbawa-com.tls=true"
      - "traefik.http.routers.api-pinnacle-lakhveerbawa-com.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-pinnacle-lakhveerbawa-com.service=api-pinnacle-lakhveerbawa-com"

      # Service
      - "traefik.http.services.api-pinnacle-lakhveerbawa-com.loadbalancer.server.port=8080"

  # NESTJS MICROSERVICES
  # Code and databases stay separate per service; all four run as separate
  # processes in one container (see backend/services/nestjs-services/start-all.sh).
  # Aliases keep the old hostnames working for the gateway and between services.
  pinnacle-services:
    build:
      context: ./backend/services/nestjs-services
      dockerfile: Dockerfile.prod.all
    environment:
      - AUTH_DATABASE_URL=postgresql://postgres:postgres@pinnacle-db:5432/auth
      - USERS_DATABASE_URL=postgresql://postgres:postgres@pinnacle-db:5432/users
      - OUTCOMES_DATABASE_URL=postgresql://postgres:postgres@pinnacle-db:5432/outcomes
      - NOTIFICATIONS_DATABASE_URL=postgresql://postgres:postgres@pinnacle-db:5432/notifications
      - REDIS_HOST=pinnacle-redis
      - USERS_SERVICE_URL=pinnacle-users-service:4450
      - KAFKA_BROKERS=pinnacle-kafka:9092
    restart: always
    depends_on:
      pinnacle-kafka:
        condition: service_healthy
      pinnacle-db:
        condition: service_started
      pinnacle-redis:
        condition: service_started
    networks:
      pinnacle-network:
        aliases:
          - pinnacle-auth-service
          - pinnacle-users-service
          - pinnacle-outcomes-service
          - pinnacle-notifications-service
      observer:
        aliases:
          - pinnacle-auth-service
          - pinnacle-users-service
          - pinnacle-outcomes-service
          - pinnacle-notifications-service
      web: {}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifications-pinnacle.rule=Host(`notifications.pinnacle.lakhveerbawa.com`)"
      - "traefik.http.routers.notifications-pinnacle.entrypoints=websecure"
      - "traefik.http.routers.notifications-pinnacle.tls=true"
      - "traefik.http.routers.notifications-pinnacle.tls.certresolver=letsencrypt"
      - "traefik.http.routers.notifications-pinnacle.service=notifications-pinnacle"
      - "traefik.http.services.notifications-pinnacle.loadbalancer.server.port=4470"

  # DATABASE: one Postgres instance; each service keeps its own database (auth, users, outcomes, notifications)
  pinnacle-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/config/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "4442:5432"
    restart: always
    networks:
      - pinnacle-network

  pinnacle-redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: always
    networks:
      - pinnacle-network

  # Debug tool, off by default: docker compose -f docker-compose-production.yml --profile tools up -d
  pinnacle-adminer:
    image: adminer:latest
    profiles: [tools]
    ports:
      - "4780:8080"
    networks: [pinnacle-network]

networks:
  pinnacle-network:
    driver: bridge
  web:
    external: true
  observer:
    driver: bridge
#    external: true // use this instead of bridge driver when ready to deploy observer stack


volumes:
  pgdata:
  redisdata:
  kafka-kraft-data:
